<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f7fb">
<title>Nexyron AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* BASE */
body {
  margin:0;
  font-family:'Inter',sans-serif;
  background:#f4f7fb;
  color:#111;
  overflow:hidden;
}

/* BACKGROUND GLOW */
body::before {
  content:'';
  position:fixed;
  width:300px;
  height:300px;
  background:radial-gradient(circle,#2f81f7,transparent);
  top:-100px;
  left:-100px;
  opacity:0.2;
  filter:blur(80px);
  z-index:-1;
}

/* INTRO */
#introOverlay {
  position:fixed;
  width:100%;
  height:100%;
  background:#f4f7fb;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#introOverlay img {
  width:80px;
  animation:zoomIn 1s ease;
}

#introOverlay h1 {
  margin-top:10px;
}

@keyframes zoomIn {
  from {transform:scale(0.5); opacity:0;}
  to {transform:scale(1); opacity:1;}
}

/* LAYOUT */
.container {
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar {
  width:220px;
  background:rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  border-right:1px solid #ddd;
  padding:15px;
}

.sidebar h2 {
  font-size:14px;
}

.new-chat {
  width:100%;
  padding:10px;
  background:linear-gradient(135deg,#2f81f7,#00c6ff);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* MAIN */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOPBAR */
.topbar {
  display:flex;
  align-items:center;
  padding:12px 15px;
  background:white;
  border-bottom:1px solid #eee;
}

.topbar img {
  width:30px;
}

.topbar span {
  margin-left:10px;
  font-weight:500;
}

/* CHAT */
.chat {
  flex:1;
  overflow-y:auto;
  padding:20px;
}

/* CENTER LOGO */
#welcome {
  text-align:center;
  margin-top:25%;
}

#welcome img {
  width:90px;
  animation:float 4s ease-in-out infinite;
}

@keyframes float {
  50% {transform:translateY(-12px);}
}

/* MESSAGES */
.msg {
  margin-bottom:15px;
  animation:fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1;}
}

.user { text-align:right; }

.bubble {
  display:inline-block;
  padding:12px;
  border-radius:14px;
  max-width:75%;
}

/* USER */
.user .bubble {
  background:linear-gradient(135deg,#2f81f7,#00c6ff);
  color:white;
}

/* AI */
.ai .bubble {
  background:white;
  border:1px solid #e5e5e5;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

/* INPUT */
.input-area {
  display:flex;
  padding:10px;
  background:white;
  border-top:1px solid #ddd;
}

input {
  flex:1;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  outline:none;
}

button {
  margin-left:10px;
  padding:12px;
  border:none;
  background:#2f81f7;
  color:white;
  border-radius:10px;
  cursor:pointer;
}

/* LOADER */
.loader span {
  width:6px;
  height:6px;
  background:#2f81f7;
  margin:2px;
  display:inline-block;
  border-radius:50%;
  animation:bounce 1s infinite alternate;
}

.loader span:nth-child(2){animation-delay:0.2s;}
.loader span:nth-child(3){animation-delay:0.4s;}

@keyframes bounce {
  to {transform:translateY(-6px);}
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="introOverlay">
  <img src="logo.png">
  <h1>NEXYRON</h1>
  <p>by PHANTOM AI</p>
</div>

<div class="container">

<div class="sidebar">
  <h2>PHANTOM</h2>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
</div>

<div class="main">

  <div class="topbar">
    <img src="logo.png">
    <span>Nexyron AI</span>
  </div>

  <div class="chat" id="chat">
    <div id="welcome">
      <img src="logo.png">
      <h3>Nexyron Phantom AI</h3>
    </div>
  </div>

  <div class="input-area">
    <input id="query" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()">Send</button>
  </div>

</div>
</div>

<script>

let chatBox = document.getElementById("chat");

/* INTRO REMOVE */
setTimeout(()=>{
  document.getElementById("introOverlay").style.opacity = "0";
  setTimeout(()=>{
    document.getElementById("introOverlay").style.display = "none";
  },1000);
},2500);

/* ADD MESSAGE */
function addMessage(text, type){
  let div = document.createElement("div");
  div.className = "msg " + type;

  let bubble = document.createElement("div");
  bubble.className = "bubble";

  div.appendChild(bubble);
  chatBox.appendChild(div);

  let i = 0;
  function type(){
    if(i < text.length){
      bubble.innerText += text.charAt(i);
      i++;
      chatBox.scrollTop = chatBox.scrollHeight;
      setTimeout(type, 8);
    }
  }
  type();
}

/* SEND */
async function send(){
  let q = document.getElementById("query").value.trim();
  if(!q) return;

  document.getElementById("welcome").style.display="none";

  addMessage(q,"user");
  document.getElementById("query").value="";

  let loading = document.createElement("div");
  loading.className="msg ai";
  loading.innerHTML="<div class='bubble'><div class='loader'><span></span><span></span><span></span></div></div>";
  chatBox.appendChild(loading);

  try{
    let res = await fetch("https://nexyron-backend.onrender.com/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({query:q})
    });

    let data = await res.json();
    chatBox.removeChild(loading);

    addMessage(data.answer || "No response","ai");

  } catch(err){
    chatBox.removeChild(loading);
    addMessage("Server error","ai");
  }
}

/* NEW CHAT */
function newChat(){
  chatBox.innerHTML = `
    <div id="welcome">
      <img src="logo.png">
      <h3>Nexyron Phantom AI</h3>
    </div>
  `;
}

</script>

</body>
</html>
