<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexyron AI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO (ONLY LOGO) -->
<div id="intro">
  <img src="logo.png">
</div>

<div class="container">

<div class="sidebar">
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
</div>

<div class="main">

<div class="topbar">
  <img src="logo.png">
  <span>Nexyron AI</span>
</div>

<div class="chat" id="chat">
  <div id="welcome">
    <img src="logo.png">
    <h3>Nexyron by PHANTOM AI</h3>
  </div>
</div>

<div class="input-area">
  <input id="query" placeholder="Ask anything..." onkeypress="if(event.key==='Enter') send()">
  <button onclick="send()">Send</button>
</div>

</div>
</div>

<script>

let chatBox = document.getElementById("chat");

/* INTRO REMOVE */
setTimeout(()=>{
  document.getElementById("intro").style.opacity="0";
  setTimeout(()=>{ document.getElementById("intro").remove(); },1000);
},2000);

/* MESSAGE */
function addMessage(text,type){
  let div=document.createElement("div");
  div.className="msg "+type;

  let bubble=document.createElement("div");
  bubble.className="bubble";
  div.appendChild(bubble);

  chatBox.appendChild(div);

  let i=0;
  function type(){
    if(i<text.length){
      bubble.innerText+=text.charAt(i);
      i++;
      chatBox.scrollTop=chatBox.scrollHeight;
      setTimeout(type,8);
    }
  }
  type();
}

/* SEND */
async function send(){
  let q=document.getElementById("query").value.trim();
  if(!q) return;

  document.getElementById("welcome").style.display="none";

  addMessage(q,"user");
  document.getElementById("query").value="";

  let load=document.createElement("div");
  load.className="msg ai";
  load.innerHTML="<div class='bubble'><div class='loader'><span></span><span></span><span></span></div></div>";
  chatBox.appendChild(load);

  try{
    let res=await fetch("/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({query:q})
    });

    let data=await res.json();
    chatBox.removeChild(load);
    addMessage(data.answer,"ai");

  }catch{
    chatBox.removeChild(load);
    addMessage("Server error","ai");
  }
}

/* NEW CHAT */
function newChat(){
  chatBox.innerHTML=`
    <div id="welcome">
      <img src="logo.png">
      <h3>Nexyron by PHANTOM AI</h3>
    </div>`;
}

</script>

</body>
</html>
