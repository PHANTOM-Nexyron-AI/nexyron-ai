<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHANTOM Nexyron AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script defer src="/_vercel/speed-insights/script.js"></script>

<style>
body {
  margin:0;
  font-family:'Inter',sans-serif;
  background:#0f1115;
  color:#e6e6e6;
  display:flex;
  height:100vh;
}

/* Sidebar */
.sidebar {
  width:230px;
  background:#0b0d11;
  padding:15px;
  border-right:1px solid #1f242b;
}

.sidebar h2 {
  font-size:14px;
  font-weight:500;
  margin-bottom:15px;
}

.new-chat {
  background:#2f81f7;
  border:none;
  padding:10px;
  width:100%;
  color:#fff;
  cursor:pointer;
  border-radius:6px;
}

/* Main */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* Chat area */
.chat {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

/* Messages */
.msg {
  margin-bottom:15px;
  max-width:700px;
}

.user {
  text-align:right;
}

.user .bubble {
  background:#2f81f7;
  color:#fff;
  display:inline-block;
  padding:10px 14px;
  border-radius:12px;
}

.ai .bubble {
  background:#1a1f27;
  padding:12px 14px;
  border-radius:12px;
}

/* Input */
.input-area {
  display:flex;
  padding:15px;
  border-top:1px solid #1f242b;
  background:#0f1115;
}

input {
  flex:1;
  padding:12px;
  border-radius:8px;
  border:1px solid #2a2f36;
  background:#171a21;
  color:#fff;
  outline:none;
}

button {
  margin-left:10px;
  padding:12px 16px;
  background:#2f81f7;
  border:none;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>PHANTOM Nexyron</h2>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
</div>

<div class="main">

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <input id="query" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">Send</button>
  </div>

</div>

<script>
let chatBox = document.getElementById("chat");

// Load saved chat
window.onload = () => {
  let saved = localStorage.getItem("nexyron_chat");
  if(saved){
    chatBox.innerHTML = saved;
  }
};

function saveChat(){
  localStorage.setItem("nexyron_chat", chatBox.innerHTML);
}

function addMessage(text, type){
  let div = document.createElement("div");
  div.className = "msg " + type;

  let bubble = document.createElement("div");
  bubble.className = "bubble";

  div.appendChild(bubble);
  chatBox.appendChild(div);

  let i = 0;
  function type(){
    if(i < text.length){
      bubble.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 10);
    }
  }
  type();

  chatBox.scrollTop = chatBox.scrollHeight;
  saveChat();
}

async function send(){
  let input = document.getElementById("query");
  let q = input.value;

  if(!q) return;

  addMessage(q, "user");
  input.value = "";

  let thinking = document.createElement("div");
  thinking.className = "msg ai";
  thinking.innerHTML = "<div class='bubble'>Thinking...</div>";
  chatBox.appendChild(thinking);

  let res = await fetch("https://YOUR-BACKEND-URL/ask", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({query:q})
  });

  let data = await res.json();

  chatBox.removeChild(thinking);

  addMessage(data.answer, "ai");

  if(data.sources && data.sources.length){
    let src = document.createElement("div");
    src.className = "msg ai";
    src.innerHTML = "<div class='bubble'>Sources:<br>" +
      data.sources.map(s => `<a href="${s}" target="_blank">${s}</a>`).join("<br>") +
      "</div>";
    chatBox.appendChild(src);
  }

  saveChat();
}

function newChat(){
  chatBox.innerHTML = "";
  localStorage.removeItem("nexyron_chat");
}
</script>

</body>
</html>
